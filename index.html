<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">

    <title>Планировщик ПВЗ</title>

    <style>
body {
  margin: 0;
  background: #f0f0f0;
  overflow: hidden;
  overscroll-behavior-x: none;
}

#container-2d {
  width: 100vw;
  height: 100vh;
}

#furniture-list {
  position: absolute;
  width: 400px;
  top: 0;
  right: 0;
  height: 100vh;
  border-left: 2px solid #000;
  padding: 20px 0;
  backdrop-filter: blur(4px);
  overflow-y: scroll;
}

.furniture {
  width: 80%;
  margin: auto;
  text-align: center;
  /*margin-bottom: 40px;*/
  padding: 40px 0;
  user-select: none;
  cursor: pointer;
}

.furniture:hover {
  background: #f0f0f0;
}

.furniture img {
  max-width: 50%;
  max-height: 10vh;
}

.furniture p {
  font-family: Helvetica, sans-serif;
  margin: 0;
  margin-top: 10px;
}
    </style>
  </head>

  <body>
    <div id="container-2d"></div>
    <div id="furniture-list"></div>

    <script type="module">
// заменяется Vite для локального дев окружения
const mode = '%MODE%';

let url;

if (mode === 'development') {
  url = './src/planner.js';
} else {
  url = `./build/planner.js`;
}

// пиздец красивый игнор, но по-другому не работает
import(/* @vite-ignore */ url).then(module => {
  const Planner = module.default;

  const container2d = document.querySelector('#container-2d');
  const planner = new Planner(container2d);
  window.planner = planner; // for debug
});
    </script>
  </body>
</html>
