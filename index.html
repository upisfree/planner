<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">

    <title>Планировщик ПВЗ</title>

    <style>
body {
  margin: 0;
  background: #f0f0f0;
  overflow: hidden;
  overscroll-behavior-x: none;
}

.hidden {
  display: none !important;
}

#container-2d,
#container-3d {
  position: absolute;
  top: 0;
  left: 0;
  width: 50vw;
  height: 100vh;
}

#container-2d {
  left: 50vw;
}

#furniture-list {
  position: absolute;
  width: 200px;
  top: 0;
  right: 0;
  height: 100vh;
  border-left: 2px solid #000;
  padding: 20px 0;
  backdrop-filter: blur(4px);
  overflow-y: scroll;
}

.furniture {
  width: 80%;
  margin: auto;
  text-align: center;
  /*margin-bottom: 40px;*/
  padding: 40px 0;
  user-select: none;
  cursor: pointer;
}

.furniture:hover {
  background: #f0f0f0;
}

.furniture img {
  max-width: 50%;
  max-height: 10vh;
}

.furniture p {
  font-family: Helvetica, sans-serif;
  margin: 0;
  margin-top: 10px;
}

#plans-list {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #ffffff;
  display: flex;
  flex-flow: row wrap;
  justify-content: center;
  align-content: center;
  z-index: 1;
}

.plan {
  width: 33vw;
}

.plan img {
  width: 100%;
  cursor: pointer;
}

.plan img:hover {
  background: #f0f0f0;
}

.new-plan {
  position: absolute;
  bottom: 20px;
  font-family: Helvetica, sans-serif;
  font-weight: normal;
  border: 3px solid #000;
  padding: 8px 20px;
  cursor: pointer;
  user-select: none;
}

.new-plan:hover {
  background: #f0f0f0;
}
    </style>
  </head>

  <body>
    <div id="plans-list">
      <div class="plan" data-plan-id="1">
        <img src="./assets/plans/1.png">
      </div>

      <div class="plan" data-plan-id="2">
        <img src="./assets/plans/2.png">
      </div>

      <div class="plan" data-plan-id="3">
        <img src="./assets/plans/3.png">
      </div>

      <h2 class="new-plan" onclick="document.getElementById('plans-list').classList.add('hidden')">новая планировка</h2>
    </div>

    <div id="container-3d"></div>
    <div id="container-2d"></div>
    <div id="furniture-list"></div>

    <script type="module">
// заменяется Vite для локального дев окружения
const mode = '%MODE%';

let url;

if (mode === 'development') {
  url = './src/planner.js';
} else {
  url = `./build/planner.js`;
}

// пиздец красивый игнор, но по-другому не работает
import(/* @vite-ignore */ url).then(module => {
  const Planner = module.default;

  const container2d = document.querySelector('#container-2d');
  const container3d = document.querySelector('#container-3d');
  const planner = new Planner(container2d, container3d);
  window.planner = planner; // for debug
});
    </script>
  </body>
</html>
